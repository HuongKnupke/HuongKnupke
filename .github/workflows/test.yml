```yml
name: Kotlin Test
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Install Kotlin
      run: sudo apt-get update && sudo apt-get install -y openjdk-11-jdk
    - name: Compile and Run
      run: kotlin HelloWorld.kt
    - name: Exit successfully
      run: echo 'Test passed'

```